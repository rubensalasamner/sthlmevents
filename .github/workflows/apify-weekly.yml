name: Weekly Apify refresh

# The Apify sources cost real money per event delivered, so they run on their
# own weekly schedule instead of the daily free-cron (snapshot.yml). The run
# is a partial refresh (`--only`): only Facebook + Instagram (keyword + curated
# profiles) events are refetched; every other source's events are kept from the
# committed snapshot. Worst case spend per run: FB ~$0.60 + IG keyword ~$0.30
# + IG profiles ~$0.04 ≈ $0.94 of the $5/month Apify credit (billing cycle
# runs the 14th -> 13th).

on:
  schedule:
    # Mondays 03:50 UTC ≈ 05:50 Stockholm — off the busy minutes, after the
    # weekend (IG posts about upcoming events cluster early in the week).
    - cron: '50 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-apify
  cancel-in-progress: false

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  # Same R2 secrets as snapshot.yml — needed so weekly FB/IG images are
  # re-hosted before signed CDN URLs expire.
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

jobs:
  apify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefix pipeline

      - name: Refresh Apify sources (Facebook + Instagram keyword + profiles)
        # Missing token -> the adapters throw -> generate-snapshot skips the
        # Apify sources but still rewrites the snapshot; committing then would
        # silently DROP the previous Apify events (nothing kept them). The
        # guard below fails the job instead so stale data stays committed.
        if: env.APIFY_TOKEN != ''
        run: npm run snapshot:apify --prefix pipeline

      - name: Fail loudly when the token is missing
        if: env.APIFY_TOKEN == ''
        run: |
          echo "::error::APIFY_TOKEN secret is not set. Add it under"
          echo "::error::Settings > Secrets and variables > Actions."
          echo "::error::Skipping the run so the committed Apify events stay."
          exit 1

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): weekly Apify refresh (Facebook + Instagram + profiles) [skip ci]'
          file_pattern: src/data/events.snapshot.json pipeline/.cache/*.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload snapshot to Cloudflare R2
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp src/data/events.snapshot.json \
            "s3://${R2_BUCKET}/events.snapshot.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control 'public, max-age=3600'
          echo "Snapshot uploaded to R2 bucket ${R2_BUCKET}"