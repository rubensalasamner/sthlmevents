name: Daily snapshot

# The daily-cron model: regenerate the event snapshot from all pipeline
# sources, commit it, and let Vercel redeploy with fresh data. The app picks
# the new snapshot up from EXPO_PUBLIC_SNAPSHOT_URL (or its bundled copy).

on:
  schedule:
    # 03:40 UTC ≈ 05:40 Stockholm. Off the busy 00:00 cron minute.
    - cron: '40 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

# Optional Cloudflare R2 upload (free tier). When the R2_* secrets are absent
# the upload step skips and Vercel remains the only snapshot host.
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pipeline

      - name: Generate snapshot
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_API_SECRET: ${{ secrets.TICKETMASTER_API_SECRET }}
          EVENEMANGSKOLLEN_API_KEY: ${{ secrets.EVENEMANGSKOLLEN_API_KEY }}
          EVENEMANGSKOLLEN_ANON_KEY: ${{ secrets.EVENEMANGSKOLLEN_ANON_KEY }}
          CATEGORIZER_API_KEY: ${{ secrets.CATEGORIZER_API_KEY }}
          CATEGORIZER_BASE_URL: ${{ secrets.CATEGORIZER_BASE_URL }}
          CATEGORIZER_MODEL: ${{ secrets.CATEGORIZER_MODEL }}
          KULTURBILJETTER_API_KEY: ${{ secrets.KULTURBILJETTER_API_KEY }}
        run: npm run snapshot --prefix pipeline

      - name: Ensure cache files exist
        # git add fails on pathspecs that match nothing; placeholders keep the
        # commit step stable even when the pipeline wrote no caches.
        run: mkdir -p pipeline/.cache && touch pipeline/.cache/og-images.json pipeline/.cache/geocodes.json pipeline/.cache/categories.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): daily snapshot refresh [skip ci]'
          file_pattern: src/data/events.snapshot.json pipeline/.cache/*.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload snapshot to Cloudflare R2
        # Skips entirely when R2 secrets are not configured; the committed
        # snapshot (served by Vercel) stays the source of truth in that case.
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp src/data/events.snapshot.json \
            "s3://${R2_BUCKET}/events.snapshot.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control 'public, max-age=3600'
          echo "Snapshot uploaded to R2 bucket ${R2_BUCKET}"
